  <!-- ===== FIREBASE & SOCIAL LOGIC ===== -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAfBOVVTaZuWdlwG-Yd6vI5hOpQzmhzjXk",
      authDomain: "enigma-42e91.firebaseapp.com",
      databaseURL: "https://enigma-42e91-default-rtdb.firebaseio.com",
      projectId: "enigma-42e91",
      storageBucket: "enigma-42e91.firebasestorage.app",
      messagingSenderId: "539411208616",
      appId: "1:539411208616:web:16f1f466166a5a5e29e59d",
      measurementId: "G-PN66LVMMW8"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ===== User State =====
    let currentUser = null;
    let userMoola = 100;

    function loadUserData() {
      const saved = localStorage.getItem('enigma_user');
      if (saved) {
        currentUser = JSON.parse(saved);
        userMoola = currentUser.moola || 100;
      }
    }

    function saveUserData() {
      if (currentUser) {
        currentUser.moola = userMoola;
        localStorage.setItem('enigma_user', JSON.stringify(currentUser));
        if (currentUser.uid) {
          db.collection('users').doc(currentUser.uid).update({
            moola: userMoola
          }).catch(() => {});
        }
      }
    }

    // ===== Feed Tabs =====
    const feedTabs = document.querySelectorAll('.feed-tab');
    const postsContainer = document.getElementById('postsFeed');

    feedTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        feedTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const feedType = tab.dataset.feed;
        filterFeed(feedType);
      });
    });

    function filterFeed(type) {
      const allPosts = postsContainer.querySelectorAll('.post-card');
      allPosts.forEach(post => {
        if (type === 'following') {
          post.style.display = 'block';
        } else if (type === 'ghost') {
          post.style.display = post.querySelector('.ghost-badge') ? 'block' : 'none';
        } else {
          post.style.display = 'block';
        }
      });
    }

    // ===== Like Button =====
    document.addEventListener('click', e => {
      if (e.target.classList.contains('like-btn')) {
        e.target.classList.toggle('liked');
        const text = e.target.textContent;
        const num = parseInt(text.replace(/\D/g, '')) || 0;
        e.target.textContent = e.target.classList.contains('liked') 
          ? `❤️ ${num + 1}` 
          : `❤️ ${num - 1}`;
      }
    });

    // ===== Earn Moola Button =====
    document.addEventListener('click', e => {
      if (e.target.classList.contains('moola-earn')) {
        const amount = parseInt(e.target.textContent.replace(/\D/g, '')) || 1;
        userMoola += amount;
        saveUserData();
        e.target.style.transform = 'scale(1.3)';
        setTimeout(() => {
          e.target.style.transform = 'scale(1)';
        }, 300);
        alert(`✨ +${amount} Moola earned!\nBalance: ${userMoola} M\n\nVisit Wallet to cash out 💜`);
      }
    });

    // ===== Create Post =====
    document.getElementById('createPostBtn').addEventListener('click', () => {
      const content = prompt('✏️ Share your moment:\n\n(Leave empty to add photo/video first)');
      if (content === null) return;
      
      if (content.trim()) {
        alert(`✅ Post created!\n\n"${content}"\n\nLive in your feed ✨\nEarn up to +5 Moola when friends engage! 💎`);
      } else {
        alert('📸 Photo/Video picker would open here ✨\n\nAdd a caption and post!');
      }
    });

    // ===== Add Story =====
    document.getElementById('addStoryBtn').addEventListener('click', () => {
      alert('📖 Your Story\n\nAdd photo/video → visible for 24 hours ✨\nEarn Moola when viewers watch! 💎');
    });

    // ===== Auth Check =====
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        loadUserData();
      }
    });
  </script>
